name: 构建备忘录 APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解压源码
        run: |
          rm -rf native out
          mkdir native out
          unzip -q "备忘录-Android原生提醒版-v1-源码.zip" -d native

      - name: 编译 APK
        run: gradle -p native :app:assembleRelease --stacktrace

      - name: 找到 APK
        run: |
          APK="$(find native -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "没有生成 APK"; exit 1; }
          echo "找到：$APK"
          cp "$APK" "out/备忘录.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 备忘录-APK
          path: out/备忘录.apk
          if-no-files-found: error
