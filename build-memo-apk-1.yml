      - name: 构建已签名 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/memo-native"
          cd "$ROOT"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/备忘.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: memo-app-apk
          path: ${{ runner.temp }}/备忘.apk
          if-no-files-found: error
          retention-days: 30
