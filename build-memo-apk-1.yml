name: 构建备忘录 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解压 Android 工程
        run: |
          mkdir native
          unzip "备忘录-Android原生提醒版-v1-源码.zip" -d native

      - name: 构建 APK
        run: gradle -p native assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 备忘录-APK
          path: native/app/build/outputs/apk/release/*.apk

