name: 构建备忘录 APK
'on': {workflow_dispatch: {}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: rm -rf native out; mkdir native out; unzip -q memo-android-source-v1.1.zip -d native; gradle -p native :app:assembleRelease --stacktrace; APK="$(find native -type f -name '*.apk' | head -n 1)"; test -n "$APK"; cp "$APK" out/memo.apk
      - uses: actions/upload-artifact@v4
        with: {name: memo-apk, path: out/memo.apk, if-no-files-found: error}
